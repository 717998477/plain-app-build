name: Build From Upstream (Auto-patch)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Auto Patch Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v7
        with:
          path: patch-repo

      - name: Fetch upstream source (with history for fallback)
        run: |
          mkdir -p src
          cd src
          git init -q
          git remote add origin https://github.com/plainhub/plain-app.git
          git fetch --shallow-since="2026-10-25" origin main
          git checkout -q -b main FETCH_HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Create local.properties
        working-directory: src
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Generate release keystore
        working-directory: src
        run: |
          keytool -genkeypair -v -keystore ./app/release.jks -storepass custom123 -alias release -keypass custom123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Custom Build,O=Custom,C=CN"
          cat > ./keystore.properties <<EOF
          storePassword=custom123
          keyPassword=custom123
          keyAlias=release
          storeFile=release.jks
          EOF

      - name: Generate debug keystore
        working-directory: src
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src/plain-rs -> src/target

      - name: Grant execute permission for gradlew
        working-directory: src
        run: chmod +x ./gradlew

      - name: Patch + Build with fallback (newest first, auto-fallback on any failure)
        id: try-patches
        run: |
          set -e
          cd src
          # 候选版本：main + 最近 20 个 commit（新 → 旧），覆盖上游重构前的基线
          COMMITS=$(git log --format=%H -20 origin/main)
          VERSIONS="main $COMMITS"
          SUCCESS=""
          for v in $VERSIONS; do
            git checkout -q "$v" 2>/dev/null || git checkout -q FETCH_HEAD
            echo "==== 尝试版本: ${v:0:12} ===="
            rm -rf /tmp/patch-run
            cp -r ../patch-repo/patches /tmp/patch-run
            # 1) 打补丁（关键项缺失即失败）
            if ! python3 /tmp/patch-run/apply-patches.py .; then
              echo "❌ 补丁脚本失败，回退下一版本..."
              git checkout -q .
              git clean -fdq
              continue
            fi
            # 2) 快速预检：Cargo.lock 必须已指向 plain-core-private（脚本锁定到其 main HEAD）
            if ! grep -q "plain-core-private.git" plain-rs/Cargo.lock; then
              echo "❌ Cargo.lock 未指向 plain-core-private，回退下一版本..."
              git checkout -q .
              git clean -fdq
              continue
            fi
            # 3) 真正构建（失败即回退）
            echo "✅ 补丁通过，开始构建..."
            if ./gradlew assembleGithubRelease -PabiFilters=arm64-v8a --stacktrace; then
              SUCCESS=$v
              echo "🎉 构建成功: ${v:0:12}"
              break
            else
              echo "❌ 构建失败，回退下一版本..."
              git checkout -q .
              git clean -fdq
              rm -rf .gradle app/build shared/build plain-common/build
            fi
          done
          if [ -z "$SUCCESS" ]; then
            echo "❌ 所有候选版本均构建失败" >&2
            exit 1
          fi
          echo "SUCCESS_VERSION=${SUCCESS:0:12}" >> "$GITHUB_OUTPUT"

      - name: Find APK
        working-directory: src
        run: find . -name "*.apk" -type f

      - name: Rename APK
        working-directory: src
        run: |
          APK_PATH=$(find . -name "app-github-release.apk" -type f | head -1)
          mv "$APK_PATH" ./PlainApp-custom-arm64-release.apk
          ls -lh PlainApp-custom-arm64-release.apk

      - name: Create Release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: upstream-build-${{ github.run_number }}
          name: Custom Build (Upstream) #${{ github.run_number }}
          artifacts: "src/PlainApp-custom-arm64-release.apk"
          draft: false
          prerelease: false
          body: |
            ## Custom Build (From Upstream)
            - 自动拉取上游最新代码并应用全部定制补丁
            - 上游结构变更过大时自动回退到可构建的旧版本
            - 本次构建基于上游版本: ${{ steps.try-patches.outputs.SUCCESS_VERSION }}
            - 去除检测更新 / 捐赠卡片 / 官方板块
            - 在最近任务中隐藏开关
            - 去除 LeakCanary
            - 自定义端口输入 / 文件列表具体时间

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlainApp-custom-arm64-release
          path: src/PlainApp-custom-arm64-release.apk
