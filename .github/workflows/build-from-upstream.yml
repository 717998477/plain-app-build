name: Build From Upstream (Auto-patch)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build From Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream latest
        run: |
          git init
          git remote add upstream https://github.com/ismartcoding/plain-app.git
          git fetch upstream
          git checkout -b main upstream/main
          git remote add origin https://717998477:${{ secrets.GITHUB_TOKEN }}@github.com/717998477/plain-app-private.git

      - name: Apply patches (auto-fix)
        run: |
          set -e
          
          # 补丁1: 关闭更新检查和捐赠卡片 (AppFeatureTypeExt.kt)
          sed -i 's|fun AppFeatureType.has(): Boolean {|fun AppFeatureType.has(): Boolean {\n    if (this == AppFeatureType.CHECK_UPDATES) return false\n    if (this == AppFeatureType.DONATION) return false|' \
            shared/src/commonMain/kotlin/com/ismartcoding/plain/platform/system/AppFeatureTypeExt.kt
          
          # 补丁2: 去掉 LeakCanary 依赖
          sed -i 's|debugImplementation(libs.leakcanary.android)|// debugImplementation(libs.leakcanary.android)|' \
            app/build.gradle.kts
          sed -i 's|debugImplementation(libs.androidx.work.multiprocess)|// debugImplementation(libs.androidx.work.multiprocess)|' \
            app/build.gradle.kts
          
          # 补丁3: 改 Cargo.toml 指向我们的私有 plain-core
          sed -i 's|https://github.com/plainhub/plain-core.git|https://github.com/717998477/plain-core-private.git|g' \
            plain-rs/Cargo.toml
          
          # 检查补丁是否生效
          echo "=== Patch check ==="
          grep -c "CHECK_UPDATES.*return false" shared/src/commonMain/kotlin/com/ismartcoding/plain/platform/system/AppFeatureTypeExt.kt && echo "✅ Update check patch applied"
          grep -c "DONATION.*return false" shared/src/commonMain/kotlin/com/ismartcoding/plain/platform/system/AppFeatureTypeExt.kt && echo "✅ Donation patch applied"
          grep -c "leakcanary.android" app/build.gradle.kts || echo "✅ LeakCanary patch applied"
          echo "=== Patches applied ==="

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v -keystore ./app/release.jks -storepass custom123 -alias release -keypass custom123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Custom Build,O=Custom,C=CN"
          cat > ./keystore.properties <<EOF
          storePassword=custom123
          keyPassword=custom123
          keyAlias=release
          storeFile=release.jks
          EOF

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK (arm64-v8a)
        run: ./gradlew assembleGithubRelease -PabiFilters=arm64-v8a --stacktrace

      - name: Find APK
        run: find . -name "*.apk" -type f

      - name: Rename APK
        run: |
          APK_PATH=$(find . -name "*-release-*.apk" -type f | head -1)
          mv "$APK_PATH" ./PlainApp-upstream-latest-arm64.apk
          ls -lh PlainApp-upstream-latest-arm64.apk

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: upstream-latest-${{ github.run_number }}
          name: Upstream Latest Build #${{ github.run_number }}
          artifacts: "PlainApp-upstream-latest-arm64.apk"
          draft: false
          prerelease: true
          body: |
            ## Auto-patched from upstream latest
            - ✅ 自动去除检测更新
            - ✅ 自动去除捐赠卡片
            - ✅ 自动去除 LeakCanary
            - ⚠️ 自定义端口、文件时间显示等深度修改可能需要手动调整
