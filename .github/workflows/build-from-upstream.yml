name: Build From Upstream (Auto-patch)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Auto Patch Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v7
        with:
          path: patch-repo

      - name: Fetch upstream source (with history)
        run: |
          mkdir -p src
          cd src
          git init -q
          git remote add origin https://github.com/plainhub/plain-app.git
          git fetch --shallow-since="2026-10-25" origin main
          git checkout -q -b main FETCH_HEAD

      - name: Fetch custom fork source (fallback target)
        run: |
          git clone -q https://x-access-token:${{ secrets.CUSTOM_PAT }}@github.com/717998477/plain-app-private.git fork-src
          cd fork-src
          git checkout -q main

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Create local.properties
        working-directory: src
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Generate release keystore
        working-directory: src
        run: |
          keytool -genkeypair -v -keystore ./app/release.jks -storepass custom123 -alias release -keypass custom123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Custom Build,O=Custom,C=CN"
          printf 'storePassword=custom123\nkeyPassword=custom123\nkeyAlias=release\nstoreFile=release.jks\n' > ./keystore.properties

      - name: Generate debug keystore
        working-directory: src
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src/plain-rs -> src/target

      - name: Grant execute permission for gradlew
        working-directory: src
        run: chmod +x ./gradlew

      - name: Patch + Build with fallback (upstream first, fallback to custom fork)
        id: try-patches
        run: |
          set -e
          cd src
          SUCCESS=""
          # ===== 候选 1: 上游 main（最新，打补丁后构建） =====
          echo "==== 尝试版本: upstream-main ===="
          rm -rf /tmp/patch-run
          cp -r ../patch-repo/patches /tmp/patch-run
          if python3 /tmp/patch-run/apply-patches.py .; then
            echo "✅ 上游补丁通过，开始构建..."
            if ./gradlew assembleGithubRelease -PabiFilters=arm64-v8a --stacktrace; then
              SUCCESS="upstream-main"
              echo "🎉 上游 main 构建成功"
            else
              echo "❌ 上游 main 构建失败，回退到定制 fork 源码..."
              git checkout -q . 2>/dev/null || true
              git clean -fdq 2>/dev/null || true
              rm -rf .gradle app/build shared/build plain-common/build
            fi
          else
            echo "❌ 上游补丁失败，回退到定制 fork 源码..."
          fi
          # ===== 候选 2: 定制 fork 源码（已含全部定制，直接构建） =====
          if [ -z "$SUCCESS" ]; then
            echo "==== 尝试版本: custom-fork ===="
            rm -rf ./*
            cp -r ../fork-src/. .
            rm -rf .git
            chmod +x ./gradlew
            keytool -genkeypair -v -keystore ./app/release.jks -storepass custom123 -alias release -keypass custom123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Custom Build,O=Custom,C=CN" >/dev/null 2>&1
            printf 'storePassword=custom123\nkeyPassword=custom123\nkeyAlias=release\nstoreFile=release.jks\n' > ./keystore.properties
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
            if ./gradlew assembleGithubRelease -PabiFilters=arm64-v8a --stacktrace; then
              SUCCESS="custom-fork"
              echo "🎉 定制 fork 构建成功"
            else
              echo "❌ 定制 fork 构建失败"
            fi
          fi
          if [ -z "$SUCCESS" ]; then
            echo "❌ 所有候选版本均构建失败" >&2
            exit 1
          fi
          echo "SUCCESS_VERSION=$SUCCESS" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        working-directory: src
        run: |
          APK_PATH=$(find . -name "app-github-release.apk" -type f | head -1)
          mv "$APK_PATH" ./PlainApp-custom-arm64-release.apk
          ls -lh PlainApp-custom-arm64-release.apk

      - name: Create Release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: upstream-build-${{ github.run_number }}
          name: Custom Build (Upstream) #${{ github.run_number }}
          artifacts: "src/PlainApp-custom-arm64-release.apk"
          draft: false
          prerelease: false
          body: |
            ## Custom Build (From Upstream)
            - 自动拉取上游最新代码并应用全部定制补丁
            - 上游结构变更过大时自动回退到定制 fork 源码构建
            - 本次构建来源: ${{ steps.try-patches.outputs.SUCCESS_VERSION }}
            - 去除检测更新 / 捐赠卡片 / 官方板块
            - 在最近任务中隐藏开关（中文）
            - 去除 LeakCanary
            - 自定义端口输入 / 文件列表具体时间

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlainApp-custom-arm64-release
          path: src/PlainApp-custom-arm64-release.apk
