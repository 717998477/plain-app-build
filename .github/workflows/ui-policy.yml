name: UI component policy
on:
  pull_request:
    paths: ['tests/**', 'plain-common/**', 'shared/src/**', 'app/src/**', 'app/build.gradle.kts', 'shared/build.gradle.kts', 'build.gradle.kts', 'settings.gradle.kts', 'ui-check/**', 'scripts/check-ui.sh', 'scripts/ui-component-baseline.tsv', '.github/workflows/ui-policy.yml', 'gradle/libs.versions.toml']
  push:
    branches: [main]
    paths: ['tests/**', 'plain-common/**', 'shared/src/**', 'app/src/**', 'app/build.gradle.kts', 'shared/build.gradle.kts', 'build.gradle.kts', 'settings.gradle.kts', 'ui-check/**', 'scripts/check-ui.sh', 'scripts/ui-component-baseline.tsv', '.github/workflows/ui-policy.yml', 'gradle/libs.versions.toml']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: bash scripts/check-ui.sh
      - run: ./gradlew :plain-common:testAndroidHostTest
